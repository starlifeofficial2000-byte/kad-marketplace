  <!-- =====================================================
       DEFAULT FAVICON

       JavaScript below will replace it with the

  ====================================================== -->

    id="dynamic-favicon"
    rel="icon"

  <link
    id="dynamic-apple-icon"
    rel="apple-touch-icon"
    href="/favicon.png"
  />


  <!-- =====================================================
       DATABASE FAVICON LOADER
  ====================================================== -->

  <script>

    (async function loadDatabaseFavicon() {

      try {

        console.log(
          "[FAVICON] Loading marketplace settings..."
        );


        /*
         * IMPORTANT:
         *
         * Your frontend and backend are hosted separately.
         *
         * Backend:
         * https://kad-marketplace-production.up.railway.app
         *
         * Therefore we request the settings from
         * the backend directly.
         */

        const API_BASE_URL =
          "https://kad-marketplace-production.up.railway.app";


        const settingsUrl =
          `${API_BASE_URL}/api/settings`;


        console.log(
          "[FAVICON] Request URL:",
          settingsUrl
        );


        /*
         * Request marketplace settings.
         */

        const response =
          await fetch(
            settingsUrl,
            {
              method: "GET",

              headers: {
                "Accept": "application/json"
              },

              cache: "no-store"
            }
          );


        /*
         * Check HTTP response.
         */

        if (!response.ok) {

          console.warn(
            "[FAVICON] Settings request failed:",
            response.status,
            response.statusText
          );

          return;

        }


        /*
         * Convert response to JSON.
         */

        const result =
          await response.json();


        console.log(
          "[FAVICON] Settings response:",
          result
        );


        /*
         * Your API may return:
         *
         * {
         *   success: true,
         *   settings: {...}
         * }
         *
         * So we first look for result.settings.
         */

        const settings =
          result?.settings ||
          result?.data ||
          result;


        /*
         * Get favicon from database.
         */

        const faviconUrl =
          settings?.favicon;


        console.log(
          "[FAVICON] Database favicon:",
          faviconUrl
        );


        /*
         * If database does not contain a favicon,
         * keep the default /favicon.png.
         */

        if (
          !faviconUrl ||
          typeof faviconUrl !== "string"
        ) {

          console.warn(
            "[FAVICON] No favicon URL returned from database."
          );

          return;

        }


        /*
         * Find normal browser favicon.
         */

        const faviconElement =
          document.getElementById(
            "dynamic-favicon"
          );


        /*
         * Replace favicon with database favicon.
         */

        if (faviconElement) {

          faviconElement.href =
            faviconUrl;

        }


        /*
         * Find Apple/mobile icon.
         */

        const appleIconElement =
          document.getElementById(
            "dynamic-apple-icon"
          );


        /*
         * Replace Apple/mobile icon.
         */

        if (appleIconElement) {

          appleIconElement.href =
            faviconUrl;

        }


        /*
         * Log successful update.
         */

        console.log(
          "[FAVICON] Database favicon loaded successfully:",
          faviconUrl
        );


      } catch (error) {

        /*
         * Do not break the website if the settings
         * endpoint is temporarily unavailable.
         */

        console.error(
          "[FAVICON] Failed to load database favicon:",
          error
        );

      }

    })();

  </script>
