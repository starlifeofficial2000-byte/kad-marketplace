<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->

    <title>KAD Marketplace | Buy & Sell in Ghana</title>

    <meta
      name="description"
      content="KAD Marketplace is a Ghanaian online marketplace where you can buy and sell products, services, electronics, phones, laptops, vehicles, fashion, properties and more."
    />

    <meta
      name="keywords"
      content="KAD Marketplace, Ghana marketplace, buy and sell Ghana, online marketplace Ghana, products Ghana, services Ghana, electronics Ghana, phones Ghana, laptops Ghana, vehicles Ghana, properties Ghana"
    />

    <meta
      name="author"
      content="KAD Technologies Ghana"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- =====================================================
         CANONICAL
    ====================================================== -->

    <link
      rel="canonical"
      href="https://kadmarket.com/"
    />

    <!-- =====================================================
         MOBILE / THEME
    ====================================================== -->

    <meta
      name="theme-color"
      content="#0D8ABC"
    />

    <meta
      name="application-name"
      content="KAD Marketplace"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="KAD Marketplace"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- =====================================================
         OPEN GRAPH
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="KAD Marketplace"
    />

    <meta
      property="og:title"
      content="KAD Marketplace | Buy & Sell in Ghana"
    />

    <meta
      property="og:description"
      content="Buy and sell products, services, electronics, phones, laptops, vehicles, properties and more on KAD Marketplace."
    />

    <meta
      property="og:url"
      content="https://kadmarket.com/"
    />

    <meta
      property="og:locale"
      content="en_GH"
    />

    <meta
      property="og:image"
      content="https://kadmarket.com/og-image.jpg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="KAD Marketplace - Ghana Online Marketplace"
    />

    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="KAD Marketplace | Buy & Sell in Ghana"
    />

    <meta
      name="twitter:description"
      content="Buy and sell products and services across Ghana on KAD Marketplace."
    />

    <meta
      name="twitter:image"
      content="https://kadmarket.com/og-image.jpg"
    />

    <!-- =====================================================
         STRUCTURED DATA - ORGANIZATION
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "KAD Marketplace",
        "url": "https://kadmarket.com/",
        "logo": "https://kadmarket.com/favicon.png",
        "description": "KAD Marketplace is a Ghanaian online marketplace for buying and selling products and services.",
        "foundingLocation": {
          "@type": "Country",
          "name": "Ghana"
        },
        "parentOrganization": {
          "@type": "Organization",
          "name": "KAD Technologies Ghana"
        }
      }
    </script>

    <!-- =====================================================
         STRUCTURED DATA - WEBSITE
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "KAD Marketplace",
        "url": "https://kadmarket.com/",
        "description": "Buy and sell products and services in Ghana on KAD Marketplace.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://kadmarket.com/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <noscript>
      KAD Marketplace is a Ghanaian online marketplace where users
      can buy and sell products and services.
    </noscript>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
